<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMT Trainer – Hamza</title>
<meta name="description" content="Oefen de Drie-Minuten-Toets (DMT) voor groep 7: 10 toetsen, 30 kaarten, timer, score en voortgang.">
<style>
:root{
  --bg:#eef2ff; --ink:#0f172a; --muted:#5b6478; --glass:rgba(255,255,255,.74); --solid:#ffffff;
  --line:rgba(15,23,42,.10); --accent:#4f46e5; --accent2:#06b6d4;
  --c1:#16a34a; --c2:#f59e0b; --c3:#8b5cf6; --ok:#16a34a; --bad:#e11d48;
  --blob1:#c7d2fe; --blob2:#a5f3fc; --shadow:0 12px 34px rgba(30,41,59,.13);
  --stage:#f5f7ff; --band:rgba(79,70,229,.045); --hover:rgba(79,70,229,.12);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1020; --ink:#e8ecf5; --muted:#9aa5bd; --glass:rgba(20,27,46,.72); --solid:#141b2e;
    --line:rgba(255,255,255,.10); --accent:#818cf8; --accent2:#22d3ee;
    --c1:#4ade80; --c2:#fbbf24; --c3:#a78bfa; --ok:#4ade80; --bad:#fb7185;
    --blob1:#1e1b4b; --blob2:#083344; --shadow:0 12px 34px rgba(0,0,0,.45);
    --stage:#0e1426; --band:rgba(129,140,248,.07); --hover:rgba(129,140,248,.2);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); min-height:100vh;
  font-family:"Atkinson Hyperlegible","Trebuchet MS",Verdana,system-ui,sans-serif; line-height:1.45;
  background:
    radial-gradient(1100px 560px at 8% -8%, var(--blob1) 0, transparent 62%),
    radial-gradient(900px 520px at 100% 0, var(--blob2) 0, transparent 58%),
    var(--bg);
  background-attachment:fixed;
}
button{font:inherit; color:inherit; cursor:pointer}
h1,h2,h3{margin:0; line-height:1.15}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:10px}
[hidden]{display:none !important}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px clamp(14px,3vw,32px); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  background:var(--glass); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:12px; margin-right:auto}
.logo{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 6px 16px rgba(79,70,229,.35)}
.brand h1{font-size:1.25rem; letter-spacing:.2px}
.brand p{margin:0; font-size:.85rem; color:var(--muted)}
.tabs{display:flex; gap:6px; padding:5px; border-radius:999px; background:var(--glass); border:1px solid var(--line)}
.tabs button{border:0; background:transparent; padding:9px 18px; border-radius:999px; font-weight:700; color:var(--muted); transition:.2s}
.tabs button.on{color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 4px 12px rgba(79,70,229,.3)}
.tabs button:not(.on):hover{color:var(--ink); background:var(--hover)}
.tools{display:flex; align-items:center; gap:10px}
.streak{display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; font-weight:800;
  background:var(--glass); border:1px solid var(--line)}
.streak svg{color:#f97316}
.ghost-btn{border:1px solid var(--line); background:var(--glass); padding:7px 12px; border-radius:999px; font-weight:800}

main{max-width:1120px; margin:0 auto; padding:clamp(14px,3vw,30px)}
.glass{background:var(--glass); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
h3.sec{margin:28px 0 12px; font-size:1.05rem; color:var(--muted); text-transform:uppercase; letter-spacing:.09em}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line); background:var(--solid); padding:11px 20px; border-radius:14px; font-weight:800; transition:transform .15s, box-shadow .2s}
.btn:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(30,41,59,.14)}
.btn:active{transform:translateY(0)}
.btn.primary{border:0; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 8px 20px rgba(79,70,229,.32)}
.btn.big{padding:15px 28px; font-size:1.1rem; border-radius:16px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45; pointer-events:none}

/* ---------- hero ---------- */
.hero{display:grid; grid-template-columns:1.3fr 1fr; gap:22px; padding:clamp(18px,3vw,32px); align-items:center}
.hero h2{font-size:clamp(1.7rem,4vw,2.5rem); margin-bottom:8px;
  background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero p{margin:0 0 18px; color:var(--muted); font-size:1.05rem; max-width:46ch}
.chips{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.chip{padding:14px 10px; text-align:center; border-radius:18px; background:var(--solid); border:1px solid var(--line)}
.chip b{display:block; font-size:2rem; line-height:1}
.chip span{font-size:.78rem; color:var(--muted)}

/* ---------- pills + tiles ---------- */
.pills{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:10px}
.pill{position:relative; border:2px solid var(--line); background:var(--glass); border-radius:18px; padding:12px 6px 10px; font-weight:800; text-align:center; transition:.18s}
.pill:hover{transform:translateY(-2px)}
.pill.on{border-color:var(--accent); background:var(--solid); box-shadow:0 8px 20px rgba(79,70,229,.2)}
.pill .n{display:block; font-size:1.4rem}
.pill small{display:block; color:var(--muted); font-weight:600; font-size:.72rem}
.pill .dots{display:flex; justify-content:center; gap:5px; margin-top:6px}
.pill .dots i{width:9px; height:9px; border-radius:50%; background:var(--line)}
.pill .dots i.d1.done{background:var(--c1)} .pill .dots i.d2.done{background:var(--c2)} .pill .dots i.d3.done{background:var(--c3)}

.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px}
.tile{position:relative; overflow:hidden; padding:22px; display:flex; flex-direction:column; gap:14px}
.tile::before{content:""; position:absolute; inset:0 0 auto 0; height:7px; background:var(--cc)}
.tile.c1{--cc:var(--c1)} .tile.c2{--cc:var(--c2)} .tile.c3{--cc:var(--c3)}
.tile-top{display:flex; justify-content:space-between; align-items:center}
.badge{font-weight:900; font-size:1.25rem}
.lvl{padding:4px 12px; border-radius:999px; font-weight:800; font-size:.82rem; color:#fff; background:var(--cc)}
.bars{display:flex; gap:5px}
.bars i{height:8px; flex:1; border-radius:6px; background:var(--line)}
.bars i.f{background:var(--cc)}
.tile-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile-stats div{padding:10px 12px; border-radius:14px; background:var(--solid); border:1px solid var(--line)}
.tile-stats small{display:block; color:var(--muted); font-size:.74rem}
.tile-stats b{font-size:1.5rem}
.tile .btn{background:var(--cc); color:#fff; border:0; margin-top:auto; font-size:1.05rem; padding:13px}
.tile.c2 .btn{color:#1f1300}

/* ---------- progress ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px}
.stat{padding:20px; position:relative; overflow:hidden}
.stat::before{content:""; position:absolute; inset:0 auto 0 0; width:7px; background:var(--cc)}
.stat.c1{--cc:var(--c1)} .stat.c2{--cc:var(--c2)} .stat.c3{--cc:var(--c3)}
.stat h4{margin:0 0 10px; font-size:1.05rem}
.stat .row4{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center}
.stat .row4 b{display:block; font-size:1.5rem}
.stat .row4 small{color:var(--muted); font-size:.72rem}
.goal{margin-top:14px; display:flex; align-items:center; gap:10px; font-size:.85rem; color:var(--muted)}
.goal input{width:74px; padding:7px 9px; border-radius:10px; border:1px solid var(--line); background:var(--solid); color:var(--ink); font:inherit; font-weight:800}
.meter{height:10px; border-radius:8px; background:var(--line); overflow:hidden; margin-top:8px}
.meter i{display:block; height:100%; background:var(--cc); border-radius:8px; transition:width .6s}
.panel{padding:clamp(16px,2.5vw,26px); margin-top:20px}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.85rem; color:var(--muted); margin:0 0 6px}
.legend i{display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px}
svg.chart{width:100%; height:auto; display:block}
.chart text{fill:var(--muted); font-size:11px}
.tbl{width:100%; border-collapse:collapse; font-size:.95rem}
.tbl th,.tbl td{padding:9px 10px; text-align:center; border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em}
.tbl td:first-child,.tbl th:first-child{text-align:left; font-weight:800}
.tbl td.tot{font-weight:900}
.hist{list-style:none; margin:0; padding:0; max-height:360px; overflow:auto}
.hist li{display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line)}
.hist .dot{width:12px; height:12px; border-radius:50%; flex:none}
.hist .when{margin-left:auto; color:var(--muted); font-size:.82rem}
.hist b{font-size:1.1rem}
.row-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
.note{color:var(--muted); font-size:.85rem; margin:10px 0 0}
.empty{color:var(--muted); padding:18px 4px}

/* ---------- norm chart + levels ---------- */
.lv{display:inline-block; min-width:2.4em; padding:3px 10px; border-radius:999px; font-weight:800; font-size:.8rem; color:#fff; text-align:center}
.lI{background:#16a34a} .lII{background:#65a30d} .lIII{background:#2563eb} .lIV{background:#f59e0b; color:#1f1300} .lV{background:#e11d48}
.legend .sw{display:inline-block; width:20px; height:12px; border-radius:4px; margin-right:6px; vertical-align:-1px}
.legend .sw.m7{background:var(--accent2); opacity:.5}
.legend .sw.e7{background:var(--accent); opacity:.4}
.legend .sw.top{height:0; border-top:3px dashed var(--ok); border-radius:0; vertical-align:3px}
.legend .sw.ham{height:4px; background:var(--ink); vertical-align:3px}
#normLegend span{display:inline-flex; align-items:center; gap:6px}
.norm-summary{display:flex; flex-wrap:wrap; align-items:center; gap:10px 24px; margin:16px 0 4px}
.ns-main b{font-size:3.2rem; line-height:1; display:block}
.ns-main small{color:var(--muted)}
.ns-chips{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.ns-d{font-weight:800}
.ns-d.up{color:var(--ok)} .ns-d.down{color:var(--bad)}
.norm-summary p{margin:0; color:var(--muted); flex-basis:100%}
.chart text.val{fill:var(--ink); font-weight:800; font-size:12px}
#modeSeg{display:inline-flex}
#lvlTable td{text-align:center}
#lvlTable td.mid{background:var(--hover)}
#lvlTable td.hl{background:var(--accent); color:#fff; font-weight:900}
#lvlTable td.grp{text-align:left; font-weight:800}

/* ---------- guide ---------- */
.steps{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.step{padding:18px; display:flex; gap:14px}
.step h4{margin:0 0 4px; font-size:1.05rem}
.step p{margin:0; color:var(--muted)}
.gl{margin:0; padding-left:1.2em; display:grid; gap:8px}
.faqs{display:grid; gap:10px}
details.faq{padding:14px 18px}
details.faq summary{cursor:pointer; font-weight:800}
details.faq p{margin:10px 0 0; color:var(--muted)}
.gloss{display:grid; grid-template-columns:max-content 1fr; gap:8px 18px; margin:0}
.gloss dt{font-weight:800}
.gloss dd{margin:0; color:var(--muted)}

/* ---------- tips ---------- */
.tipgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px}
.tip{padding:20px; display:flex; gap:14px}
.tip .num,.step .num{flex:none; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-weight:900; color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2))}
.tip p{margin:0}

/* ---------- stage (reading screen) ---------- */
.stage{position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; background:var(--stage)}
.st-top{display:flex; align-items:center; gap:14px; padding:10px clamp(10px,2vw,24px); border-bottom:1px solid var(--line); background:var(--glass)}
.st-title{margin-right:auto; display:flex; flex-direction:column}
.st-title b{font-size:1.15rem}
.st-title small{color:var(--muted)}
.zoom{display:flex; gap:6px}
.zoom button{border:1px solid var(--line); background:var(--solid); border-radius:10px; padding:7px 11px; font-weight:900}
.counter{text-align:center; min-width:70px}
.counter small{display:block; color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em}
.counter b{font-size:1.7rem; line-height:1}
.ring{position:relative; width:74px; height:74px; flex:none}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent); stroke-linecap:round; stroke-dasharray:213.63; stroke-dashoffset:0}
.ring.low .fg{stroke:var(--bad)}
.ring b{position:absolute; inset:0; display:grid; place-items:center; font-size:1.45rem}
.st-hint{padding:9px clamp(10px,2vw,24px); font-weight:700; background:var(--band); border-bottom:1px solid var(--line); min-height:42px}
.board-wrap{position:relative; flex:1; min-height:0}
.board{
  --fit:min(1.5vw, calc((100dvh - 220px) / 30 * .6)); --zoom:1;
  font-size:calc(max(14px, var(--fit)) * var(--zoom));
  height:100%; overflow:auto; padding:8px clamp(6px,2vw,22px) 14px;
}
.rows{display:grid; grid-template-rows:repeat(30,minmax(1.75em,auto)); min-width:max-content; width:100%}
.row{display:grid; grid-template-columns:2.2em repeat(5,minmax(8.6em,1fr)); align-items:stretch; border-radius:10px}
.row:nth-child(even){background:var(--band)}
.row.cur{background:var(--hover)}
.rn{display:grid; place-items:center; color:var(--muted); font-size:.7em; font-weight:700; user-select:none}
.w{border:0; background:transparent; font-size:1em; font-weight:700; letter-spacing:.015em; white-space:nowrap; padding:.2em .5em; border-radius:10px;
  text-align:center; color:var(--ink); transition:background .12s, opacity .2s}
.w:hover{background:var(--hover)}
.w.past{opacity:.5}
.w.mark{opacity:1; background:var(--accent); color:#fff; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent)}
.w.err{background:var(--bad); color:#fff; opacity:1; text-decoration:line-through; text-decoration-thickness:2px}
.w.dim{opacity:.25}
.wc{display:flex; align-items:stretch; min-width:0}
.wc .w{flex:1; min-width:0}
.spk{display:none; flex:none; width:1.7em; border:0; background:transparent; color:var(--accent); border-radius:50%; padding:0; place-items:center; cursor:pointer; text-decoration:none}
.spk svg{width:1.05em; height:1.05em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.spk:hover{background:var(--hover)}
.board.spk-on .spk{display:grid}
.board.spk-on .row{grid-template-columns:2.2em repeat(5,minmax(10.4em,1fr))}
.board.blur .rows{filter:blur(10px); pointer-events:none; user-select:none}
.overlay{position:absolute; inset:0; display:grid; grid-template-columns:minmax(0,1fr); place-items:center; padding:16px; text-align:center}
.ov-card{width:100%; max-width:520px; padding:30px; border-radius:26px; background:var(--glass); border:1px solid var(--line); box-shadow:var(--shadow);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.ov-card h2{font-size:1.9rem; margin-bottom:10px}
.ov-card p{color:var(--muted); margin:0 0 20px; font-size:1.05rem}
.count{font-size:min(34vw,220px); font-weight:900; line-height:1; background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent; animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.4); opacity:0} 40%{transform:scale(1.1); opacity:1} 100%{transform:scale(1)}}
.st-bottom{display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; padding:10px; border-top:1px solid var(--line); background:var(--glass)}
.seg{display:flex; padding:4px; border-radius:14px; background:var(--solid); border:1px solid var(--line)}
.seg button{border:0; background:transparent; padding:9px 16px; border-radius:10px; font-weight:800; color:var(--muted)}
.seg button.on{background:var(--accent); color:#fff}

/* ---------- modal ---------- */
.modal{position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:16px; background:rgba(8,12,28,.55); backdrop-filter:blur(6px)}
.res{width:min(560px,100%); max-height:94vh; overflow:auto; padding:28px; background:var(--solid); border-radius:28px; border:1px solid var(--line); box-shadow:var(--shadow); text-align:center; animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(24px) scale(.96); opacity:0} to{transform:none; opacity:1}}
.stars{display:flex; justify-content:center; gap:8px; margin-bottom:6px}
.stars svg{width:46px; height:46px; color:var(--line)}
.stars svg.on{color:#f59e0b; filter:drop-shadow(0 4px 8px rgba(245,158,11,.5)); animation:pop .6s ease-out both}
.stars svg:nth-child(2).on{animation-delay:.12s} .stars svg:nth-child(3).on{animation-delay:.24s}
.res h2{font-size:1.6rem}
.big-num{font-size:5.5rem; font-weight:900; line-height:1; margin:8px 0 0;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.res .unit{color:var(--muted); margin-bottom:14px}
.res .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0}
.res .grid3 div{padding:12px 6px; border-radius:16px; background:var(--bg); border:1px solid var(--line)}
.res .grid3 b{display:block; font-size:1.6rem}
.res .grid3 small{color:var(--muted); font-size:.74rem}
.delta{font-weight:800; margin:6px 0}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.badge-new{display:inline-block; padding:6px 14px; border-radius:999px; font-weight:900; color:#fff; margin:6px 0 2px;
  background:linear-gradient(135deg,#f59e0b,#ef4444)}
.res .actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px}
#confetti{position:fixed; inset:0; z-index:90; pointer-events:none}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .tabs{order:3; width:100%; justify-content:space-between}
  .tabs button{flex:1; padding:9px 6px}
  .st-top{flex-wrap:wrap}
  .zoom{order:5}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2.1-.1-2.9a2.2 2.2 0 0 0-2.9-.1z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.9A12.9 12.9 0 0 1 22 2c0 2.7-.8 7.5-6 11a22.4 22.4 0 0 1-4 2z"/><path d="M9 12H4s.6-3 2-4c1.6-1.1 5 0 5 0"/><path d="M12 15v5s3-.6 4-2c1.1-1.6 0-5 0-5"/></svg>
    </div>
    <div><h1 data-i18n="appTitle">DMT Trainer</h1><p data-i18n="sub">Hamza · Groep 7</p></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="practice" class="on" data-i18n="tabPractice">Oefenen</button>
    <button role="tab" data-tab="progress" data-i18n="tabProgress">Resultaten</button>
    <button role="tab" data-tab="guide" data-i18n="tabGuide">Gids</button>
    <button role="tab" data-tab="tips" data-i18n="tabTips">Tips</button>
  </nav>
  <div class="tools">
    <span class="streak" id="streak" title="Streak"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-1.6.6-2.9 1.5-4C9 10 10 11 11 11c0-3 1-6 1-9z"/></svg><b id="streakN">0</b></span>
    <button class="ghost-btn" id="lang" aria-label="Language">EN</button>
  </div>
</header>

<main>
  <!-- PRACTICE -->
  <section id="tab-practice">
    <div class="hero glass">
      <div>
        <h2 data-i18n="hello">Hoi Hamza!</h2>
        <p data-i18n="helloSub"></p>
        <button id="recBtn" class="btn primary big"></button>

/* ---------------- storage ---------------- */
const load = () => {
  try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && Array.isArray(j.history)) return j; } catch (e) {}
  return { history: [], goals: {}, lang: 'nl' };
};
let store = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
let lang = store.lang === 'en' ? 'en' : 'nl';
let mode = store.mode === 'c123' ? 'c123' : 'c23';
const t = (k, o = {}) => {
  let s = (T[lang][k] !== undefined ? T[lang][k] : (T.nl[k] !== undefined ? T.nl[k] : k));
  for (const x in o) s = String(s).split('{' + x + '}').join(o[x]);
  return s;
};

/* ---------------- stats helpers ---------------- */
const hist = c => store.history.filter(x => x.c === c);
const bestFor = c => hist(c).reduce((m, x) => Math.max(m, x.correct), 0);
const lastIn = (e, c) => { const h = store.history.filter(x => x.e === e && x.c === c); return h.length ? h[h.length - 1] : null; };
const dayKey = d => { d = new Date(d); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const streak = () => {
  const days = new Set(store.history.map(x => dayKey(x.ts)));
  let n = 0; const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
};
const recommend = () => {
  for (let e = 1; e <= 10; e++) for (let c = 1; c <= 3; c++) if (!lastIn(e, c)) return { e, c };
  let pick = { e: 1, c: 1 }, oldest = Infinity;
  for (let e = 1; e <= 10; e++) for (let c = 1; c <= 3; c++) { const l = lastIn(e, c); if (l.ts < oldest) { oldest = l.ts; pick = { e, c }; } }
  return pick;
};
const fmtDate = ts => new Date(ts).toLocaleString(lang === 'nl' ? 'nl-NL' : 'en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const col = c => 'var(--c' + c + ')';
const NORMS = {
  c23: { M7: { I: 182, II: [167, 181], III: [150, 166], IV: [129, 149] }, E7: { I: 188, II: [173, 187], III: [156, 172], IV: [134, 155] } },
  c123: { M7: { I: 302, II: [277, 301], III: [251, 276], IV: [219, 250] }, E7: { I: 312, II: [287, 311], III: [259, 286], IV: [227, 258] } }
};
const sumFor = (e, m) => {
  const ls = (m === 'c23' ? [2, 3] : [1, 2, 3]).map(c => lastIn(e, c));
  return ls.every(Boolean) ? ls.reduce((a, x) => a + x.correct, 0) : null;
};
const levelOf = (v, n) => v >= n.I ? 'I' : v >= n.II[0] ? 'II' : v >= n.III[0] ? 'III' : v >= n.IV[0] ? 'IV' : 'V';

/* ---------------- render: practice ---------------- */
let selExam = recommend().e;

function renderPractice() {
  const h = store.history;
  $('#chipTries').textContent = h.length;
  $('#chipBest').textContent = h.reduce((m, x) => Math.max(m, x.correct), 0);
  const s = streak();
  $('#chipStreak').textContent = s; $('#streakN').textContent = s;
  const rec = recommend();
  const rb = $('#recBtn'); rb.textContent = t('rec', rec); rb.onclick = () => openStage(rec.e, rec.c);

  $('#examPills').innerHTML = Array.from({ length: 10 }, (_, i) => {
    const e = i + 1;
    return `<button class="pill${e === selExam ? ' on' : ''}" data-exam="${e}" aria-pressed="${e === selExam}">
      <small>${t('exam')}</small><span class="n">${e}</span>
      <span class="dots">${[1, 2, 3].map(c => `<i class="d${c}${lastIn(e, c) ? ' done' : ''}"></i>`).join('')}</span></button>`;
  }).join('');

  $('#cardTiles').innerHTML = [1, 2, 3].map(c => {
    const l = lastIn(selExam, c), b = bestFor(c);
    return `<article class="tile glass c${c}">
      <div class="tile-top"><span class="badge">${t('card')} ${c}</span><span class="lvl">${t('lvl' + c)}</span></div>
      <div class="bars">${[1, 2, 3].map(k => `<i class="${k <= c ? 'f' : ''}"></i>`).join('')}</div>
      <div class="tile-stats">
        <div><small>${t('best')}</small><b>${b || '–'}</b></div>
        <div><small>${t('thisExam', { e: selExam })}</small><b>${l ? l.correct : '–'}</b></div>
      </div>
      <button class="btn" data-start="${c}">${t('start')} ${t('card')} ${c}</button>
    </article>`;
  }).join('');
}

/* ---------------- render: progress ---------------- */
function renderProgress() {
  $('#statCards').innerHTML = [1, 2, 3].map(c => {
    const hs = hist(c), n = hs.length, best = bestFor(c);
    const last = n ? hs[n - 1].correct : '–';
    const avg = n ? Math.round(hs.reduce((a, x) => a + x.correct, 0) / n) : '–';
    const goal = +store.goals[c] || 0;
    const pct = goal ? Math.min(100, Math.round(best / goal * 100)) : 0;
    return `<article class="stat glass c${c}">
      <h4>${t('card')} ${c} · ${t('lvl' + c)}</h4>
      <div class="row4">
        <div><b>${best || '–'}</b><small>${t('best')}</small></div>
        <div><b>${last}</b><small>${t('last')}</small></div>
        <div><b>${avg}</b><small>${t('avg')}</small></div>
        <div><b>${n}</b><small>${t('tries')}</small></div>
      </div>
      <div class="goal"><label for="g${c}">${t('goal')}</label>
        <input id="g${c}" type="number" inputmode="numeric" min="0" max="150" placeholder="–" value="${goal || ''}" data-goal="${c}">
        <span>${t('words')}</span></div>
      <div class="meter"><i style="width:${pct}%"></i></div>
    </article>`;
  }).join('');

  renderChart();

  const lvc = (v, n) => v === null ? '–' : `<span class="lv l${levelOf(v, n)}">${levelOf(v, n)}</span>`;
  let rows = `<tr><th>${t('exam')}</th>${[1, 2, 3].map(c => `<th>${t('card')} ${c}</th>`).join('')}<th>2+3</th><th>1+2+3</th><th>M7</th><th>E7</th></tr>`;
  for (let e = 1; e <= 10; e++) {
    const ls = [1, 2, 3].map(c => lastIn(e, c));
    const s23 = sumFor(e, 'c23'), s123 = sumFor(e, 'c123'), cur = mode === 'c23' ? s23 : s123;
    rows += `<tr><td>${t('exam')} ${e}</td>${ls.map(x => `<td>${x ? x.correct : '–'}</td>`).join('')}<td class="tot">${s23 === null ? '–' : s23}</td><td class="tot">${s123 === null ? '–' : s123}</td><td>${lvc(cur, NORMS[mode].M7)}</td><td>${lvc(cur, NORMS[mode].E7)}</td></tr>`;
  }
  $('#totals').innerHTML = rows;
  renderNormChart();
  renderLevelTable();

  const h = store.history.slice(-40).reverse();
  $('#hist').innerHTML = h.length ? h.map(x => `<li><span class="dot" style="background:${col(x.c)}"></span>
    <span>${t('exam')} ${x.e} · ${t('card')} ${x.c}</span><b>${x.correct}</b>
    <small>(${x.reached} − ${x.errors})</small><span class="when">${fmtDate(x.ts)}</span></li>`).join('')
    : `<li class="empty">${t('empty')}</li>`;
}

function renderChart() {
  const series = [1, 2, 3].map(c => hist(c).map(x => x.correct));
  const n = Math.max(...series.map(s => s.length));
  const host = $('#chart');
  if (n < 2) { host.innerHTML = `<p class="empty">${t('noTrend')}</p>`; return; }
  const W = 720, H = 250, L = 38, R = 14, Tp = 12, B = 26;
  const maxV = Math.max(10, Math.ceil(Math.max(...series.flat()) / 10) * 10);
  const x = i => L + (n === 1 ? 0 : i * (W - L - R) / (n - 1));
  const y = v => Tp + (1 - v / maxV) * (H - Tp - B);
  let g = '';
  for (let k = 0; k <= 5; k++) {
    const v = maxV * k / 5, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${Math.round(v)}</text>`;
  }
  let lines = '';
  series.forEach((s, i) => {
    if (!s.length) return;
    const c = i + 1, pts = s.map((v, k) => `${x(k).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    lines += `<polyline points="${pts}" fill="none" stroke="${col(c)}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    lines += s.map((v, k) => `<circle cx="${x(k).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5" fill="var(--solid)" stroke="${col(c)}" stroke-width="3"/>`).join('');
  });
  host.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('trend')}">${g}${lines}</svg>`;
}

/* ---------------- render: norm chart ---------------- */
function renderNormChart() {
  const nm = NORMS[mode];
  $('#modeC23').classList.toggle('on', mode === 'c23');
  $('#modeC123').classList.toggle('on', mode === 'c123');
  const vals = Array.from({ length: 10 }, (_, i) => sumFor(i + 1, mode));
  const done = vals.map((v, i) => v === null ? null : { e: i + 1, v }).filter(Boolean);
  const swatch = inner => `<svg width="22" height="12" aria-hidden="true">${inner}</svg>`;
  const sw = {
    m7: swatch('<rect width="22" height="12" rx="3" fill="var(--accent2)" opacity=".5"/>'),
    e7: swatch('<rect width="22" height="12" rx="3" fill="var(--accent)" opacity=".4"/>'),
    top: swatch('<line x1="0" x2="22" y1="6" y2="6" stroke="var(--ok)" stroke-width="3" stroke-dasharray="6 4"/>'),
    ham: swatch('<line x1="0" x2="22" y1="6" y2="6" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>')
  };
  $('#normLegend').innerHTML = `<span>${sw.m7}${t('lgM7')}</span><span>${sw.e7}${t('lgE7')}</span><span>${sw.top}${t('lgTop')}</span><span>${sw.ham}${t('lgHamza')}</span>`;

  let sum;
  if (!done.length) sum = `<p class="empty">${t('normNeed')}</p>`;
  else {
    const last = done[done.length - 1], prev = done.length > 1 ? done[done.length - 2] : null;
    const lm = levelOf(last.v, nm.M7), le = levelOf(last.v, nm.E7), gap = nm.E7.III[0] - last.v;
    const d = prev ? last.v - prev.v : null;
    sum = `<div class="ns-main"><b>${last.v}</b><small>${t('exam')} ${last.e}</small></div>
      <div class="ns-chips"><span class="lv l${lm}">M7 · ${lm}</span><span class="lv l${le}">E7 · ${le}</span>
      ${d === null ? '' : `<span class="ns-d ${d >= 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d} ${t('normVsPrev')}</span>`}</div>
      <p>${gap > 0 ? t('normGap', { n: gap }) : t('normAbove')}</p>`;
  }
  $('#normSummary').innerHTML = sum;

  const W = 720, H = 300, L = 46, R = 16, Tp = 18, B = 34;
  const hi0 = Math.max(nm.E7.I + 10, ...done.map(d => d.v + 10));
  const lo0 = Math.max(0, Math.min(nm.M7.IV[0], ...done.map(d => d.v)) - 20);
  const stepT = hi0 - lo0 > 200 ? 50 : hi0 - lo0 > 100 ? 20 : 10;
  const hi = Math.ceil(hi0 / stepT) * stepT, lo = Math.floor(lo0 / stepT) * stepT;
  const x = e => L + (e - 1) * (W - L - R) / 9;
  const y = v => Tp + (1 - (v - lo) / (hi - lo)) * (H - Tp - B);
  let g = '';
  for (let v = lo; v <= hi; v += stepT) {
    const yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--line)"/><text x="${L - 8}" y="${(yy + 4).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`;
  }
  for (let e = 1; e <= 10; e++) g += `<text x="${x(e).toFixed(1)}" y="${H - 12}" text-anchor="middle">${e}</text>`;
  const band = (n, fill, op) => `<rect x="${L}" width="${W - L - R}" y="${y(n.III[1] + 1).toFixed(1)}" height="${(y(n.III[0]) - y(n.III[1] + 1)).toFixed(1)}" fill="${fill}" opacity="${op}"/>`;
  g += band(nm.M7, 'var(--accent2)', .28) + band(nm.E7, 'var(--accent)', .22);
  g += `<line x1="${L}" x2="${W - R}" y1="${y(nm.E7.I).toFixed(1)}" y2="${y(nm.E7.I).toFixed(1)}" stroke="var(--ok)" stroke-width="2" stroke-dasharray="7 6"/>`;
  if (done.length) {
    const pts = done.map(d => `${x(d.e).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    done.forEach((d, i) => {
      const isLast = i === done.length - 1;
      g += `<circle cx="${x(d.e).toFixed(1)}" cy="${y(d.v).toFixed(1)}" r="${isLast ? 7 : 5}" fill="${isLast ? '#f97316' : 'var(--solid)'}" stroke="var(--ink)" stroke-width="3"><title>${t('exam')} ${d.e}: ${d.v}</title></circle>`;
      g += `<text class="val" x="${x(d.e).toFixed(1)}" y="${(y(d.v) - 12).toFixed(1)}" text-anchor="middle">${d.v}</text>`;
    });
  }
  $('#normChart').innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('normTitle')}">${g}</svg>`;
}

function renderLevelTable() {
  const rng = (a) => `${a[0]}–${a[1]}`;
  let h = `<tr><th>${t('lvlCards')}</th><th>${t('lvlExam')}</th><th>I</th><th>II</th><th>III</th><th>IV</th><th>V</th></tr>`;
  [['c23', '2+3'], ['c123', '1+2+3']].forEach(([m, label]) => {
    const done = Array.from({ length: 10 }, (_, i) => sumFor(i + 1, m)).filter(v => v !== null);
    const last = done.length ? done[done.length - 1] : null;
    ['M7', 'E7'].forEach((tt, k) => {
      const n = NORMS[m][tt];
      const cells = ['I', 'II', 'III', 'IV', 'V'];
      const txt = { I: `≥ ${n.I}`, II: rng(n.II), III: rng(n.III), IV: rng(n.IV), V: `0–${n.IV[0] - 1}` };
      const cur = last !== null && m === mode ? levelOf(last, n) : null;
      h += `<tr>${k === 0 ? `<td class="grp" rowspan="2">${t('card')} ${label}</td>` : ''}<td><b>${tt}</b></td>` +
        cells.map(c => `<td class="${c === 'III' ? 'mid' : ''}${cur === c ? ' hl' : ''}">${txt[c]}</td>`).join('') + '</tr>';
    });
  });
  $('#lvlTable').innerHTML = h;
}

/* ---------------- render: guide ---------------- */
function renderGuide() {
  const g = T[lang].g;
  const li = a => a.map(x => `<li>${x}</li>`).join('');
  $('#guideBox').innerHTML = `
    <div class="hero glass" style="grid-template-columns:1fr"><div>
      <h2>${t('guideTitle')}</h2><p>${t('guideIntro')}</p>
      <button class="btn primary big" id="guideStart">${t('guideStart')}</button></div></div>
    <h3 class="sec">${g.whatT}</h3><div class="panel glass" style="margin-top:0"><ul class="gl">${li(g.what)}</ul></div>
    <h3 class="sec">${g.stepsT}</h3>
    <div class="steps">${g.steps.map((x, i) => `<div class="step glass"><div class="num">${i + 1}</div><div><h4>${x[0]}</h4><p>${x[1]}</p></div></div>`).join('')}</div>
    <h3 class="sec">${g.errT}</h3><div class="panel glass" style="margin-top:0"><p style="margin:0">${g.err}</p></div>
    <h3 class="sec">${g.graphT}</h3><div class="panel glass" style="margin-top:0"><ul class="gl">${li(g.graph)}</ul></div>
    <h3 class="sec">${g.planT}</h3><div class="panel glass" style="margin-top:0"><ul class="gl">${li(g.plan)}</ul></div>
    <h3 class="sec">${g.faqT}</h3>
    <div class="faqs">${g.faq.map(x => `<details class="faq glass"><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</div>
    <h3 class="sec">${g.glossT}</h3>
    <div class="panel glass" style="margin-top:0"><dl class="gloss">${g.gloss.map(x => `<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('')}</dl></div>`;
  $('#guideStart').onclick = () => { $('[data-tab=practice]').click(); const r = recommend(); openStage(r.e, r.c); };
}

/* ---------------- render: tips ---------------- */
function renderTips() {
  $('#tipGrid').innerHTML = T[lang].tips.map((s, i) => `<div class="tip glass"><div class="num">${i + 1}</div><p>${s}</p></div>`).join('');
  $('#howList').innerHTML = '<ol style="margin:0; padding-left:1.2em; display:grid; gap:8px">' + T[lang].how.map(s => `<li>${s}</li>`).join('') + '</ol>';
}

function applyLang() {
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#lang').textContent = lang === 'nl' ? 'EN' : 'NL';
  document.title = 'DMT Trainer – Hamza';
  renderAll();
  if (st && !$('#stage').hidden) { setStageTexts(); updateHint(); }
}
function renderAll() { renderPractice(); renderProgress(); renderGuide(); renderTips(); }

/* ---------------- tabs ---------------- */
$$('.tabs button').forEach(b => b.addEventListener('click', () => {
  $$('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['practice', 'progress', 'guide', 'tips'].forEach(n => { $('#tab-' + n).hidden = n !== b.dataset.tab; });
  if (b.dataset.tab === 'progress') renderProgress();
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}));
$('#lang').addEventListener('click', () => { lang = lang === 'nl' ? 'en' : 'nl'; store.lang = lang; save(); applyLang(); });
$('#examPills').addEventListener('click', ev => {
  const b = ev.target.closest('[data-exam]'); if (!b) return;
  selExam = +b.dataset.exam; renderPractice();
});
$('#cardTiles').addEventListener('click', ev => {
  const b = ev.target.closest('[data-start]'); if (b) openStage(selExam, +b.dataset.start);
});
$('#statCards').addEventListener('change', ev => {
  const i = ev.target.closest('[data-goal]'); if (!i) return;
  const v = Math.max(0, Math.min(150, parseInt(i.value, 10) || 0));
  if (v) store.goals[i.dataset.goal] = v; else delete store.goals[i.dataset.goal];
  save(); renderProgress();
});
$('#modeSeg').addEventListener('click', ev => {
  const b = ev.target.closest('[data-mode]'); if (!b) return;
  mode = b.dataset.mode; store.mode = mode; save(); renderProgress();
});
$('#clearBtn').addEventListener('click', () => {
  if (!confirm(t('confirmClear'))) return;
  store.history = []; save(); renderAll();
});
$('#csvBtn').addEventListener('click', () => {
  const rows = ['date,exam,card,reached,errors,correct'].concat(store.history.map(x =>
    [new Date(x.ts).toISOString(), x.e, x.c, x.reached, x.errors, x.correct].join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' }));
  a.download = 'hamza-dmt-results.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

/* ---------------- audio ---------------- */
let ac = null;
const wake = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} };
const beep = (f = 880, d = .14, v = .12) => {
  try {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
};

/* ---------------- stage ---------------- */
let st = null, zoom = 1;
const board = $('#board'), rowsEl = $('#rows');
const CIRC = 213.63;

function setStageTexts() {
  $('#stTitle').textContent = `${t('exam')} ${st.e} · ${t('card')} ${st.c}`;
  $('#stLvl').textContent = t('lvl' + st.c);
  $('#ovTitle').textContent = t('ready');
  $('#ovText').textContent = t('readyHint');
  $('#ovStart').textContent = t('go');
}

const SPK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function openStage(e, c) {
  wake();
  st = { e, c, words: DATA[e - 1][c - 1], phase: 'ready', marker: -1, errors: new Set(), mode: 'last', raf: 0, t0: 0 };
  let html = '';
  for (let r = 0; r < 30; r++) {
    html += `<div class="row" data-r="${r}"><span class="rn">${r + 1}</span>`;
    for (let k = 0; k < 5; k++) { const i = r * 5 + k; html += `<span class="wc"><button class="w" data-i="${i}" tabindex="-1">${st.words[i]}</button><a class="spk" href="https://translate.google.com/?sl=nl&tl=en&op=translate&text=${encodeURIComponent(st.words[i])}" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-label="${t('spkLabel')}" title="${t('spkLabel')}">${SPK_ICON}</a></span>`; }
    html += '</div>';
  }
  rowsEl.innerHTML = html;
  board.classList.add('blur'); board.scrollTop = 0;
  $('#stage').hidden = false; document.body.style.overflow = 'hidden';
  $('#modal').hidden = true;
  $('#overlay').hidden = false; $('#ovCard').hidden = false; $('#ovCount').hidden = true;
  $('#stBottom').hidden = true;
  setRing(TIME); $('#stReached').textContent = '0';
  setStageTexts(); updateHint();
  $('#ovStart').focus();
}

function setRing(left) {
  $('#ringFg').style.strokeDashoffset = (CIRC * (1 - left / TIME)).toFixed(2);
  $('#stTime').textContent = Math.ceil(left);
  $('#ring').classList.toggle('low', left <= 10 && st && st.phase === 'running');
}

function updateHint() {
  if (!st) return;
  const h = { ready: t('readyHint'), count: t('readyHint'), running: t('hintRun'), mark: st.mode === 'last' ? t('hintLast') : t('hintErr') }[st.phase] || '';
  $('#stHint').textContent = st.phase === 'mark' ? `${h} ${t('spkHint')}` : h;
  $('#segLast').classList.toggle('on', st.mode === 'last');
  $('#segErr').classList.toggle('on', st.mode === 'errors');
}

function updateMarks() {
  const run = st.phase === 'running', mk = st.phase === 'mark';
  board.classList.toggle('spk-on', mk);
  $$('.w', rowsEl).forEach(b => {
    const i = +b.dataset.i;
    b.classList.toggle('past', run && i < st.marker);
    b.classList.toggle('mark', st.marker === i);
    b.classList.toggle('err', st.errors.has(i));
    b.classList.toggle('dim', mk && st.marker >= 0 && i > st.marker);
  });
  $$('.row', rowsEl).forEach(r => r.classList.toggle('cur', st.marker >= 0 && +r.dataset.r === Math.floor(st.marker / 5)));
  $('#stReached').textContent = st.marker + 1;
  $('#finishBtn').disabled = st.marker < 0;
}

$('#ovStart').addEventListener('click', () => {
  wake(); st.phase = 'count';
  $('#ovCard').hidden = true; const c = $('#ovCount'); c.hidden = false;
  let n = 3;
  const step = () => {
    if (!st || st.phase !== 'count') return;
    if (n === 0) { c.hidden = true; $('#overlay').hidden = true; beep(1175, .3); beginRun(); return; }
    c.textContent = n; c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';
    beep(660, .12); n--; setTimeout(step, 800);
  };
  step();
});

function beginRun() {
  st.phase = 'running'; board.classList.remove('blur');
  updateHint(); updateMarks();
  st.t0 = performance.now();
  const me = st;
  const tick = () => {
    if (st !== me || me.phase !== 'running') { clearInterval(me.raf); return; }
    const left = Math.max(0, TIME - (performance.now() - me.t0) / 1000);
    setRing(left);
    if (left <= 0) endRun();
  };
  me.raf = setInterval(tick, 50);
  tick();
}

function endRun() {
  clearInterval(st.raf);
  st.phase = 'mark'; st.mode = st.marker >= 0 ? 'errors' : 'last';
  setRing(0); $('#ring').classList.remove('low');
  beep(520, .5, .16);
  $('#stBottom').hidden = false;
  updateHint(); updateMarks();
  if (st.marker >= 0) scrollToWord(st.marker);
}

function scrollToWord(i) {
  const b = $(`.w[data-i="${i}"]`, rowsEl);
  if (b) b.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
}

rowsEl.addEventListener('click', ev => {
  const b = ev.target.closest('.w'); if (!b || !st) return;
  const i = +b.dataset.i;
  if (st.phase === 'running') { st.marker = i; updateMarks(); return; }
  if (st.phase !== 'mark') return;
  if (st.mode === 'last') {
    st.marker = i;
    [...st.errors].forEach(x => { if (x > i) st.errors.delete(x); });
    st.mode = 'errors';
  } else {
    if (i > st.marker) return;
    st.errors.has(i) ? st.errors.delete(i) : st.errors.add(i);
  }
  updateHint(); updateMarks();
});
$('#segLast').addEventListener('click', () => { st.mode = 'last'; updateHint(); });
$('#segErr').addEventListener('click', () => { if (st.marker >= 0) { st.mode = 'errors'; updateHint(); } });
$('#zIn').addEventListener('click', () => { zoom = Math.min(2.2, +(zoom + .15).toFixed(2)); board.style.setProperty('--zoom', zoom); });
$('#zOut').addEventListener('click', () => { zoom = Math.max(.7, +(zoom - .15).toFixed(2)); board.style.setProperty('--zoom', zoom); });

function closeStage(force) {
  if (st && (st.phase === 'running' || st.phase === 'mark' || st.phase === 'count') && !force && !confirm(t('confirmQuit'))) return;
  if (st) { clearInterval(st.raf); st.phase = 'closed'; }
  $('#stage').hidden = true; document.body.style.overflow = '';
  renderAll();
}
$('#stBack').addEventListener('click', () => closeStage(false));

/* ---------------- result ---------------- */
const starSvg = on => `<svg class="${on ? 'on' : ''}" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`;

$('#finishBtn').addEventListener('click', () => {
  if (st.marker < 0) return;
  const reached = st.marker + 1, errors = st.errors.size, correct = reached - errors;
  const prev = hist(st.c), prevLast = prev.length ? prev[prev.length - 1] : null, prevBest = bestFor(st.c);
  const rec = { ts: Date.now(), e: st.e, c: st.c, reached, errors, correct };
  store.history.push(rec); save();

  let stars = 1, msg = t('s1'), isBest = false;
  if (!prevLast) { stars = 2; msg = t('first'); }
  else if (correct > prevBest) { stars = 3; isBest = true; msg = t('s3'); }
  else if (correct >= prevLast.correct) { stars = 2; msg = t('s2'); }

  let delta = '';
  if (prevLast) {
    const d = correct - prevLast.correct;
    delta = d === 0 ? `<div class="delta">${t('same')}</div>`
      : `<div class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d} ${t('vsLast', { d: '' }).trim()}</div>`;
  }
  const s23 = sumFor(st.e, 'c23');
  const total = s23 !== null ? `<div class="delta up">${t('examTotal', { e: st.e, n: s23, l: levelOf(s23, NORMS.c23.E7) })}</div>` : '';
  const acc = reached ? Math.round(correct / reached * 100) : 0;

  $('#res').innerHTML = `
    <div class="stars">${[1, 2, 3].map(k => starSvg(k <= stars)).join('')}</div>
    <h2>${t('resultTitle')}</h2>
    ${isBest ? `<span class="badge-new">${t('newBest')}</span>` : ''}
    <div class="big-num">${correct}</div><div class="unit">${t('unit')}</div>
    <div class="grid3">
      <div><b>${reached}</b><small>${t('reached')}</small></div>
      <div><b>${errors}</b><small>${t('errors')}</small></div>
      <div><b>${acc}%</b><small>${t('accuracy')}</small></div>
    </div>
    ${delta}${total}
    <p style="color:var(--muted); margin:8px 0 0">${msg}</p>
    <div class="actions">
      <button class="btn" id="rAgain">${t('again')}</button>
      <button class="btn primary" id="rNext">${t('nextCard')}</button>
      <button class="btn ghost" id="rClose">${t('close')}</button>
    </div>`;
  const e0 = st.e, c0 = st.c;
  $('#modal').hidden = false;
  $('#rAgain').onclick = () => { $('#modal').hidden = true; closeStage(true); openStage(e0, c0); };
  $('#rNext').onclick = () => { const r = recommend(); $('#modal').hidden = true; closeStage(true); openStage(r.e, r.c); };
  $('#rClose').onclick = () => { $('#modal').hidden = true; closeStage(true); };
  $('#rNext').focus();
  st.phase = 'closed';
  if (stars === 3) confetti();
  beep(784, .12); setTimeout(() => beep(988, .12), 130); setTimeout(() => beep(1319, .25), 260);
});

document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!$('#modal').hidden) { $('#rClose').click(); return; }
  if (!$('#stage').hidden) closeStage(false);
});

/* ---------------- confetti ---------------- */
function confetti() {
  if (reduce) return;
  const cv = $('#confetti'), cx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#4f46e5', '#06b6d4', '#f59e0b', '#16a34a', '#e11d48', '#8b5cf6'];
  const ps = Array.from({ length: 170 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .4,
    vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 4, s: 5 + Math.random() * 7,
    c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .4
  }));
  const t0 = performance.now();
  (function f(now) {
    const k = (now - t0) / 3200;
    cx.clearRect(0, 0, cv.width, cv.height);
    if (k >= 1) return;
    ps.forEach(p => {
      p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .99;
      cx.save(); cx.globalAlpha = 1 - k * k; cx.translate(p.x, p.y); cx.rotate(p.r);
      cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66); cx.restore();
    });
    requestAnimationFrame(f);
  })(t0);
}

applyLang();
})();
</script>
</body>
